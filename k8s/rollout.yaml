apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: zero-downtime-gitops
  namespace: gitops-demo

spec:
  replicas: 3

  strategy:
    canary:
      stableService: zero-downtime-stable
      canaryService: zero-downtime-canary

      steps:
      - setWeight: 25

      - pause:
          duration: 30s

      - analysis:
          templates:
          - templateName: success-rate

      - setWeight: 50

      - pause:
          duration: 30s

      - analysis:
          templates:
          - templateName: success-rate

      - setWeight: 100

  selector:
    matchLabels:
      app: zero-downtime-gitops

  template:
    metadata:
      labels:
        app: zero-downtime-gitops

    spec:
      containers:
      - name: flask-app

        image: ghcr.io/muhammad-ahmadd-shafiq/zero-downtime-gitops:b4ff169b776946e3dd67a9bb979f2696f038d459

        imagePullPolicy: Always

        ports:
        - containerPort: 5000

        envFrom:
        - configMapRef:
            name: app-config

        - secretRef:
            name: app-secret

        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"