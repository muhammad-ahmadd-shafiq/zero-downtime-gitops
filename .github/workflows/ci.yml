name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Tests
        run: pytest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/zero-downtime-gitops:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/zero-downtime-gitops:${{ github.sha }}

      - name: Update Kubernetes Manifest
        run: |
          sed -i \
            "s|image: ghcr.io/${{ github.repository_owner }}/zero-downtime-gitops:.*|image: ghcr.io/${{ github.repository_owner }}/zero-downtime-gitops:${{ github.sha }}|" \
            k8s/deployment.yaml

      - name: Commit and Push Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          git diff --cached --quiet && exit 0

          git commit -m "Update image to ${{ github.sha }} [skip ci]"
          git push